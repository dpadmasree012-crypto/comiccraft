<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ComicCraft — AI Comic Creator</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🦸 ComicCraft</h1>
            <p class="tagline">Create your own AI-generated comic story</p>
        </header>

        <form action="/generate" method="post" class="card">
            <label>Story Prompt:</label>
            <textarea name="prompt" rows="3" placeholder="e.g., A brave fox exploring an enchanted forest" required></textarea>

            <label>Main Character Name:</label>
            <input type="text" name="character_name" placeholder="e.g., Fox" required>

            <label>Setting:</label>
            <select name="setting" required>
                <option value="forest">Forest</option>
                <option value="city">City</option>
                <option value="space">Space</option>
                <option value="school">School</option>
                <option value="ocean">Ocean</option>
                <option value="mountain">Mountain</option>
            </select>

            <label>Story Tone:</label>
            <select name="tone" required>
                <option value="dramatic">Dramatic</option>
                <option value="funny">Funny</option>
                <option value="light-hearted">Light-hearted</option>
                <option value="poetic">Poetic</option>
                <option value="mysterious">Mysterious</option>
            </select>

            <label>Art Style:</label>
            <select name="style" required>
                <option value="anime">Anime</option>
                <option value="comic book">Comic Book</option>
                <option value="realistic">Realistic</option>
                <option value="pixel art">Pixel Art</option>
                <option value="watercolor">Watercolor</option>
            </select>

            <button type="submit">Generate Comic</button>
        </form>
    </div>
</body>
</html>
